<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Clínico - Balanço Hídrico</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
            --primary: #0ea5e9;
            --primary-glow: rgba(14, 165, 233, 0.4);
            --accent: #10b981;
            --success: #22c55e;
            --error: #ef4444;
            --gold: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 20% 0%, #0f172a 0%, #0b1020 60%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 16px;
        }
        .quiz-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 24px;
            width: 100%; max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
            text-align: center;
        }
        .top-bar-info {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; font-size: 13px; font-weight: 800;
        }
        .score-display {
            background: rgba(251, 191, 36, 0.15);
            color: var(--gold);
            padding: 4px 10px; border-radius: 99px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .progress-container {
            width: 100%; height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 99px;
            transition: width 0.5s ease;
        }
        .question-box {
            font-size: 17px; font-weight: 700;
            line-height: 1.4;
            text-align: left;
            margin-bottom: 16px;
        }
        .cards-grid {
            display: grid; grid-template-columns: 1fr; gap: 12px;
        }
        .card-opcao {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex; align-items: center; gap: 12px;
            text-align: left; width: 100%; color: inherit; font-family: inherit;
        }
        .card-opcao:hover:not(.disabled) {
            border-color: var(--primary);
            background: rgba(14, 165, 233, 0.12);
        }
        .card-opcao.disabled { cursor: not-allowed; pointer-events: none; }
        .card-icone { font-size: 28px; min-width: 40px; text-align: center; }
        .card-opcao span { font-size: 14px; font-weight: 600; line-height: 1.3; }
        .card-opcao.correto {
            background: rgba(34, 197, 94, 0.25) !important;
            border-color: var(--success) !important;
        }
        .card-opcao.incorreto {
            background: rgba(239, 68, 68, 0.25) !important;
            border-color: var(--error) !important;
        }
        .btn-voltar {
            margin-top: 16px; display: inline-block;
            background: rgba(255,255,255,0.08); color: #cbd5e1;
            padding: 8px 16px; border-radius: 8px; text-decoration: none;
            font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="top-bar-info">
            <span id="bloco-indicador">Simulação 1 de 6</span>
            <div class="score-display" id="score-display">⭐ 0 pts</div>
        </div>
        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="question-box" id="pergunta-texto">Carregando cenário clínico...</div>
        <div class="cards-grid" id="grid-cards"></div>
        <a href="index.html" class="btn-voltar">⬅ Voltar ao Brain Hub</a>
    </div>

    <script>
        const simulacoes = [
            {
                bloco: 1,
                pergunta: "Paciente internado na Clínica Médica sob cuidados de Enfermagem. No plantão de 12 horas, recebeu 1500ml de soro IV, 400ml de dieta enteral e eliminou 1100ml de diurese mais 200ml de débito em dreno. Qual é o Balanço Hídrico (BH) parcial do período?",
                opcoes: [
                    { texto: "BH Positivo de +600 ml (Entradas superam as eliminações).", icone: "📈", correto: true },
                    { texto: "BH Negativo de -600 ml (Perdas superiores às entradas).", icone: "📉", correto: false },
                    { texto: "BH Neutro de 0 ml (Equilíbrio exato de fluidos).", icone: "⚖️", correto: false },
                    { texto: "BH Positivo de +1900 ml (Somatório total sem subtrair perdas).", icone: "📊", correto: false }
                ]
            },
            {
                bloco: 2,
                pergunta: "Durante a anotação de Enfermagem, o técnico observa que um paciente acamado apresentou episódios de vômito volumoso estimado em 300ml e fezes líquidas de 400ml. Como esses dados impactam o controle hídrico?",
                opcoes: [
                    { texto: "Devem ser somados rigorosamente às eliminações totais do paciente no impresso de controle.", icone: "📋", correto: true },
                    { texto: "Devem ser ignorados pois representam perdas insensíveis difíceis de mensurar.", icone: "🚫", correto: false },
                    { texto: "Devem ser abatidos diretamente do volume de soro infundido na veia.", icone: "💉", correto: false },
                    { texto: "Entram apenas no relatório médico de alta, sem necessidade na folha de Enfermagem.", icone: "📁", correto: false }
                ]
            },
            {
                bloco: 3,
                pergunta: "Na Nutrição Clínica, ao monitorar a hidratação de um paciente idoso em uso de dieta por sonda enteral restrita, qual sinal clínico precoce indica alerta hídrico?",
                opcoes: [
                    { texto: "Mucosas secas, diminuição da turgidez da pele e redução do débito urinário (oligúria).", icone: "💧", correto: true },
                    { texto: "Aumento repentino da frequência respiratória acima de 40 irpm.", icone: "🫁", correto: false },
                    { texto: "Edema generalizado nos membros inferiores (anasarca).", icone: "🦵", correto: false },
                    { texto: "Elevação drástica dos níveis de glicemia capilar em jejum.", icone: "🩸", correto: false }
                ]
            },
            {
                bloco: 4,
                pergunta: "No cálculo de perdas insensíveis (água evaporada pelos pulmões e pele) para um adulto sem febre em 24 horas, qual parâmetro padrão é comumente utilizado na rotina hospitalar?",
                opcoes: [
                    { texto: "Cerca de 8 a 12 ml/kg de peso corporal por dia.", icone: "🌡️", correto: true },
                    { texto: "Exatamente 5 litros diários fixos para qualquer biotipo.", icone: "🌊", correto: false },
                    { texto: "Apenas o volume total de suor visível após banho morno.", icone: "🚿", correto: false },
                    { texto: "Zero, pois perdas insensíveis não entram em cálculos de alta precisão.", icone: "✖️", correto: false }
                ]
            },
            {
                bloco: 5/5, // Ajuste lógico da última questão
                pergunta: "Um paciente pós-cirúrgico apresenta retenção urinária aguda e bexigoma palpável, sem conseguir urinar há 6 horas, apesar de ter recebido hidratação venosa contínua. Qual conduta imediata da equipe de Enfermagem sob prescrição?",
                opcoes: [
                    { texto: "Comunicar o enfermeiro/médico e preparar material para sondagem vesical de alívio, registrando o volume drenado.", icone: "🩺", correto: true },
                    { texto: "Aumentar a velocidade do soro fisiológico para forçar o estímulo renal.", icone: "⚡", correto: false },
                    { texto: "Administrar diurético oral de alta potência por conta própria.", icone: "💊", correto: false },
                    { texto: "Aguardar o próximo plantão para verificar se a diurese retorna espontaneamente.", icone: "⏰", correto: false }
                ]
            }
        ];

        let indiceAtual = 0;
        let pontuacao = 0;
        let bloqueado = false;

        function carregarSimulacao() {
            bloqueado = false;
            const atual = simulacoes[indiceAtual];
            document.getElementById('bloco-indicador').textContent = `Simulação ${indiceAtual + 1} de ${simulacoes.length}`;
            document.getElementById('pergunta-texto').textContent = atual.pergunta;
            document.getElementById('score-display').textContent = `⭐ ${pontuacao} pts`;
            document.getElementById('progress-fill').style.width = `${((indiceAtual) / simulacoes.length) * 100}%`;

            const grid = document.getElementById('grid-cards');
            grid.innerHTML = '';

            // Embaralhar opções
            const opcoes = [...atual.opcoes].sort(() => Math.random() - 0.5);

            opcoes.forEach(op => {
                const card = document.createElement('button');
                card.className = 'card-opcao';
                card.innerHTML = `<div class="card-icone">${op.icone}</div><span>${op.texto}</span>`;
                card.onclick = () => selecionar(op, card);
                grid.appendChild(card);
            });
        }

        function selecionar(op, card) {
            if (bloqueado) return;
            bloqueado = true;
            const cards = document.querySelectorAll('.card-opcao');
            cards.forEach(c => c.classList.add('disabled'));

            if (op.correto) {
                card.classList.add('correto');
                pontuacao += 20;
                setTimeout(() => {
                    indiceAtual++;
                    if (indiceAtual < simulacoes.length) {
                        carregarSimulacao();
                    } else {
                        finalizar();
                    }
                }, 1400);
            } else {
                card.classList.add('incorreto');
                setTimeout(() => {
                    cards.forEach(c => c.classList.remove('disabled'));
                    bloqueado = false;
                    card.classList.remove('incorreto');
                }, 1200);
            }
        }

        function finalizar() {
            if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 80 });
            document.querySelector('.quiz-container').innerHTML = `
                <div style="text-align:center; padding: 20px;">
                    <div style="font-size:70px; margin-bottom:10px;">⚖️</div>
                    <h2 style="color:var(--gold); margin-bottom:10px;">Simulação Concluída!</h2>
                    <p style="font-size:18px; font-weight:bold; margin-bottom:15px;">Pontuação Total: ${pontuacao} pontos</p>
                    <p style="color:#94a3b8; font-size:14px; margin-bottom:20px;">Excelente domínio prático sobre balanço hídrico e assistência em saúde!</p>
                    <a href="index.html" class="btn-voltar" style="display:inline-block; padding:12px 24px; background:var(--primary); color:#fff; border-radius:12px;">Voltar ao Brain Hub</a>
                </div>
            `;
        }

        carregarSimulacao();
    </script>
</body>
</html>
